<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معلومات الاتصال — عشائر الحمودي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&family=Almarai:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f5ead8;color:#201e1d;font-family:'Almarai',system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.7}
  a{color:#8c491a}
  .page{max-width:620px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
  h1{font-family:'Rakkas',serif;font-weight:400;margin:0;line-height:1.3;font-size:34px}
  .muted{color:#645c50;font-size:16px}
  .box{background:#ebddc5;border:2px solid #dcd3c4;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .white{background:#f9f4ed}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-weight:800;font-size:17px;color:#474238}
  label .req{color:#b2442d}
  input,textarea{width:100%;min-height:56px;padding:12px 18px;border-radius:18px;border:2px solid #dcd3c4;background:#fff;font-family:'Almarai';font-size:19px;color:#201e1d}
  textarea{min-height:96px;line-height:1.7;resize:vertical}
  input.bad,textarea.bad{border-color:#c0583d}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 20px;border-radius:20px;border:2px solid #b2622d;background:#c67139;color:#fff2eb;font-family:'Almarai';font-size:20px;font-weight:800;cursor:pointer}
  .btn:hover{background:#b2622d}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.sage{background:#e1eecc;border-color:#ccdbb2;color:#3d472b;font-size:18px;min-height:52px}
  .btn.sage:hover{background:#d5e5bb}
  .loc{font-size:16px;color:#3d472b}
  .err{color:#a8361f;font-weight:700;min-height:1em}
  .done{text-align:center;gap:8px}
  .done h1{font-size:30px}
  :focus-visible{outline:3px solid #c67139;outline-offset:2px}
  .brand{display:flex;align-items:center;gap:8px;color:#8c491a;text-decoration:none;font-weight:800}
  .dot{width:12px;height:12px;border-radius:50%;background:#c67139;display:inline-block}
</style>
</head>
<body>
<main class="page" id="app">
  <a class="brand" href="index.html"><span class="dot"></span>عشائر الحمودي</a>
  <h1>معلومات الاتصال</h1>
  <div class="muted">أهلاً بك. اكتب معلوماتك ليتواصل معك القائمون على شجرة عشائر الحمودي. هذه المعلومات خاصة، لا تُنشر للعامة ولا يراها غيرهم.</div>
  <form class="box white" id="f" novalidate>
    <div class="field">
      <label for="fName">الاسم الرباعي <span class="req">*</span></label>
      <input id="fName" autocomplete="name" placeholder="اسمك واسم أبيك وجدك وجد أبيك">
    </div>
    <div class="field">
      <label for="fPhone">رقم الهاتف <span class="req">*</span></label>
      <input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right" placeholder="07xxxxxxxxx">
    </div>
    <div class="field">
      <label for="fAddr">عنوان السكن <span class="req">*</span></label>
      <textarea id="fAddr" placeholder="المحافظة، القضاء، المنطقة أو الحي"></textarea>
      <button type="button" class="btn sage" id="bLoc">📍 أرسل موقعي الحالي</button>
      <div class="loc" id="locMsg">يكفي أن تكتب العنوان أو ترسل موقعك الحالي.</div>
    </div>
    <div class="field">
      <label for="fWa">رقم الواتساب (إن كان مختلفاً)</label>
      <input id="fWa" type="tel" inputmode="tel" dir="ltr" style="text-align:right" placeholder="07xxxxxxxxx">
    </div>
    <div class="err" id="err" role="alert"></div>
    <button type="submit" class="btn" id="bSend">إرسال</button>
  </form>
</main>
<script>
(function(){
  var URL_='https://baytalqasid.app.n8n.cloud/webhook/family-tree-private';
  var q=new URLSearchParams(location.search);
  var loc=null;
  function $(id){return document.getElementById(id)}
  function ar2en(s){return String(s||'').replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)})}
  var pre=q.get('name')||q.get('n')||'';
  try{var sv=JSON.parse(localStorage.getItem('ft-contact')||'{}');$('fName').value=pre||sv.n||'';$('fPhone').value=sv.p||'';$('fAddr').value=sv.a||''}catch(e){$('fName').value=pre}
  $('bLoc').onclick=function(){
    if(!navigator.geolocation){$('locMsg').textContent='جهازك لا يدعم إرسال الموقع، اكتب العنوان بدلاً منه.';return}
    $('locMsg').textContent='جارٍ تحديد موقعك…';
    navigator.geolocation.getCurrentPosition(function(p){
      loc={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};
      $('locMsg').textContent='✓ وصل موقعك الحالي.';$('bLoc').textContent='📍 تحديث موقعي';$('fAddr').classList.remove('bad');
    },function(){$('locMsg').textContent='لم نتمكن من معرفة موقعك. اسمح بالوصول إلى الموقع أو اكتب العنوان.'},{enableHighAccuracy:true,timeout:15000});
  };
  $('f').onsubmit=function(ev){
    ev.preventDefault();
    var n=$('fName').value.replace(/\s+/g,' ').trim(),ph=ar2en($('fPhone').value).replace(/[^\d+]/g,''),a=$('fAddr').value.trim(),wa=ar2en($('fWa').value).replace(/[^\d+]/g,'');
    ['fName','fPhone','fAddr'].forEach(function(i){$(i).classList.remove('bad')});
    var words=n.split(' ').filter(function(w){return w&&w!=='بن'&&w!=='ابن'});
    if(words.length<4){$('fName').classList.add('bad');$('err').textContent='اكتب اسمك الرباعي: اسمك واسم أبيك وجدك وجد أبيك.';$('fName').focus();return}
    var d=ph.replace(/^\+?964/,'0');if(d.length===10&&d[0]==='7')d='0'+d;
    if(!/^07\d{9}$/.test(d)&&d.replace(/\D/g,'').length<10){$('fPhone').classList.add('bad');$('err').textContent='اكتب رقم هاتف صحيحاً، مثل 07xxxxxxxxx';$('fPhone').focus();return}
    if(!a&&!loc){$('fAddr').classList.add('bad');$('err').textContent='اكتب عنوان سكنك أو أرسل موقعك الحالي.';$('fAddr').focus();return}
    $('err').textContent='';$('bSend').disabled=true;$('bSend').textContent='جارٍ الإرسال…';
    try{localStorage.setItem('ft-contact',JSON.stringify({n:n,p:d,a:a}))}catch(e){}
    var body={action:'contact',by:n,phone:d,address:a,whatsapp:wa,path:q.get('p')||'',src:'contact'};
    if(loc){body.lat=loc.lat;body.lng=loc.lng}
    fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok||j.ok===false)throw 0;
        $('app').innerHTML='';var b=document.createElement('div');b.className='box white done';
        b.innerHTML='<h1>شكراً لك 🌿</h1><div>وصلت معلومات اتصالك إلى القائمين على شجرة عشائر الحمودي، وسيتواصلون معك إن شاء الله.</div><div><a href="index.html">فتح شجرة العشيرة</a></div>';
        $('app').appendChild(b);window.scrollTo(0,0)})})
      .catch(function(){$('bSend').disabled=false;$('bSend').textContent='إرسال';$('err').textContent='لم تُرسل المعلومات. تأكد من الإنترنت وحاول مرة أخرى.'});
  };
})();
</script>
</body>
</html>
