<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>خريطة شجرة عشائر الحمودي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&family=Almarai:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#f5ead8;color:#201e1d;font-family:'Almarai',system-ui,sans-serif}
  a{color:#8c491a}a:hover{color:#6e3812}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;background:#f5ead8}
  #stage.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block}
  .lk{fill:none;stroke:#c9bfae;stroke-width:2}
  .lk.on{stroke:#c67139;stroke-width:3.5}
  .nd{cursor:pointer}
  .nd rect{fill:#fff2eb;stroke:#ffe1d0;stroke-width:2}
  .nd.top rect{fill:#ebddc5;stroke:#dcd3c4}
  .nd text{font-family:'Almarai',sans-serif;font-size:15px;font-weight:700;fill:#8c491a;pointer-events:none}
  .nd.top text{font-size:17px;font-weight:800;fill:#201e1d}
  .tg{cursor:pointer}
  .tg circle{fill:#f9f4ed;stroke:#c67139;stroke-width:2}
  .tg text{font-family:'Almarai',sans-serif;font-size:13px;font-weight:800;fill:#8c491a;pointer-events:none}
  .tg.open circle{fill:#c67139;stroke:#b2622d}
  .tg.open text{fill:#fff2eb;font-size:18px}
  .tg:hover circle{fill:#ffe1d0}.tg.open:hover circle{fill:#b2622d}
  .top-ui{flex-wrap:wrap}
  .modes{display:flex;gap:8px;flex-wrap:wrap}
  .modes a,.modes button{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:999px;border:2px solid #dcd3c4;background:#f9f4ed;color:#474238;font-family:'Almarai';font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(46,43,37,.12);white-space:nowrap}
  .modes a:hover,.modes button:hover{background:#fff2eb;color:#474238}
  .modes .on{background:#7a8a5e;border-color:#5f6d47;color:#f5f8ee}
  .modes .on:hover{background:#5f6d47;color:#f5f8ee}
  .slots{display:flex;gap:8px;flex-wrap:wrap}
  .slot{flex:1 1 140px;min-height:52px;padding:8px 16px;border-radius:20px;border:2px dashed #c9bfae;background:#f5ead8;font-family:'Almarai';font-size:16px;font-weight:800;color:#645c50;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:2px}
  .slot small{font-size:12px;font-weight:700;color:#645c50}
  .slot.act{border:2px solid #c67139;background:#fff2eb;color:#8c491a}
  .slot.full{border-style:solid;color:#201e1d}
  .relres{font-size:17px;line-height:1.85;color:#201e1d}
  .relres b{color:#8c491a}
  .cap{position:fixed;bottom:90px;right:50%;transform:translateX(50%);padding:12px 28px;border-radius:28px;min-width:200px;text-align:center;background:#201e1d;color:#f5ead8;z-index:7;display:none;flex-direction:column;align-items:center;gap:2px;box-shadow:0 10px 30px rgba(46,43,37,.3);max-width:calc(100% - 24px)}
  .cap b{font-family:'Rakkas',serif;font-weight:400;font-size:30px;line-height:1.2}
  .cap span{white-space:nowrap;font-size:14px;font-weight:700;color:#e9dcc6}
  .stopbtn{position:fixed;bottom:22px;right:50%;transform:translateX(50%);z-index:8;display:none;min-height:52px;padding:10px 24px;border-radius:999px;border:2px solid #b2622d;background:#c67139;color:#fff2eb;font-family:'Almarai';font-size:16px;font-weight:800;cursor:pointer}
  .ctl .txt{width:auto;padding:0 16px;font-size:15px;white-space:nowrap}
  .nd.hit rect{fill:#e1eecc;stroke:#7a8a5e}
  .nd.hit text{fill:#3d472b}
  .nd.path rect{fill:#ffe1d0;stroke:#c67139}
  .nd.sel rect{fill:#c67139;stroke:#b2622d}
  .nd.sel text{fill:#fff2eb}
  svg.far .nd.deep text{display:none}
  svg.far .nd.deep rect{fill:#e9b593;stroke:none}
  svg.far .nd.deep.sel rect,svg.far .nd.deep.path rect{fill:#c67139}
  .top-ui{position:fixed;top:12px;right:12px;left:12px;display:flex;gap:10px;align-items:flex-start;z-index:5;pointer-events:none}
  .top-ui>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 14px;border-radius:999px;background:#f9f4ed;border:2px solid #dcd3c4;box-shadow:0 4px 14px rgba(46,43,37,.12);text-decoration:none;color:#201e1d;white-space:nowrap;min-height:52px}
  .brand b{font-family:'Rakkas',serif;font-weight:400;font-size:22px;line-height:1}
  .brand .dot{width:12px;height:12px;border-radius:999px;background:#c67139}
  .sbox{position:relative;flex:1 1 auto;max-width:440px}
  .sbox input{width:100%;min-height:52px;padding:12px 20px;border-radius:999px;border:2px solid #dcd3c4;background:#f9f4ed;font-family:'Almarai';font-size:17px;color:#201e1d;box-shadow:0 4px 14px rgba(46,43,37,.12)}
  .sbox input:focus-visible{outline:2px solid #c67139;outline-offset:2px}
  .sug{position:absolute;top:60px;right:0;left:0;max-height:52vh;overflow:auto;border-radius:22px;background:#f9f4ed;border:2px solid #dcd3c4;box-shadow:0 10px 30px rgba(46,43,37,.18);display:none;padding:6px}
  .sug button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:right;padding:10px 14px;border:0;border-radius:16px;background:transparent;font-family:'Almarai';cursor:pointer;min-height:48px}
  .sug button:hover,.sug button:focus-visible{background:#fff2eb;outline:none}
  .sug .n{font-size:17px;font-weight:800;color:#201e1d}
  .sug .c{font-size:13px;color:#645c50;line-height:1.6}
  .ctl{position:fixed;left:14px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .ctl button{width:52px;height:52px;border-radius:999px;border:2px solid #dcd3c4;background:#f9f4ed;color:#474238;font-family:'Almarai';font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(46,43,37,.12);display:flex;align-items:center;justify-content:center}
  .ctl button:hover{background:#fff2eb}
  .ctl button:active{background:#ffe1d0}
  .ctl button:focus-visible{outline:2px solid #c67139;outline-offset:2px}
  .ctl svg{width:22px;height:22px}
  .sheet{position:fixed;right:12px;bottom:12px;width:min(420px,calc(100% - 88px));border-radius:26px;background:#f9f4ed;border:2px solid #dcd3c4;box-shadow:0 12px 34px rgba(46,43,37,.2);padding:18px 18px 16px;display:none;flex-direction:column;gap:12px;z-index:6}
  .sheet h2{margin:0;font-family:'Rakkas',serif;font-weight:400;font-size:30px;line-height:1.15}
  .sheet .chain{font-size:15px;line-height:1.8;color:#474238}
  .sheet .meta{display:flex;flex-wrap:wrap;gap:7px}
  .sheet .meta span{padding:5px 12px;border-radius:999px;background:#e1eecc;border:2px solid #ccdbb2;color:#3d472b;font-size:13px;font-weight:800}
  .sheet .acts{display:flex;flex-wrap:wrap;gap:8px}
  .sheet .acts a,.sheet .acts button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:999px;border:2px solid #dcd3c4;background:#f9f4ed;color:#474238;font-family:'Almarai';font-size:15px;font-weight:800;cursor:pointer;text-decoration:none}
  .sheet .acts .pri{background:#c67139;border-color:#b2622d;color:#fff2eb}
  .sheet .acts .pri:hover{background:#b2622d}
  .sheet .x{position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:999px;border:0;background:transparent;font-size:24px;color:#645c50;cursor:pointer}
  .hint{position:fixed;right:50%;transform:translateX(50%);bottom:22px;padding:10px 18px;border-radius:999px;background:#201e1d;color:#f5ead8;font-size:14px;font-weight:700;z-index:4;transition:opacity .6s;white-space:nowrap}
  .load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#645c50}
  @media(max-width:640px){
    .brand b{display:none}.brand{padding:8px 14px}
    .sheet{right:8px;left:8px;width:auto;bottom:8px}
    .ctl{bottom:auto;top:76px;left:12px}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  #circ{position:fixed;inset:0;z-index:4;background:#f5ead8;overflow:auto;display:none;padding:96px clamp(10px,3vw,28px) 24px;flex-direction:column;gap:12px}
  #circ>*{flex-shrink:0}
  #circ{overflow-x:hidden}
  #circ .crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
  #circ .crumbs button{padding:7px 14px;border-radius:999px;border:2px solid #dcd3c4;background:#ebddc5;color:#474238;font-family:'Almarai';font-size:14px;font-weight:800;cursor:pointer;min-height:40px}
  #circ .crumbs button:last-child{background:#c67139;border-color:#b2622d;color:#fff2eb}
  #circ .crumbs .sep{color:#c0b6a5;font-weight:800}
  #circ .info{display:flex;flex-wrap:wrap;gap:8px}
  #circ .info span{padding:6px 14px;border-radius:999px;background:#e1eecc;border:2px solid #ccdbb2;color:#3d472b;font-size:14px;font-weight:800}
  #circ .board{display:flex;align-items:center;justify-content:center;min-height:300px}
  #circ svg{position:static;max-width:100%;width:auto;height:auto;display:block;touch-action:auto;cursor:auto}
  #circ svg text{font-family:'Almarai',sans-serif;pointer-events:none}
  #circ .tip{font-size:14px;color:#645c50;line-height:1.7}
</style>
</head>
<body>
<div id="stage"><svg id="svg"><g id="world"><g id="links"></g><g id="nodes"></g></g></svg></div>
<div class="load" id="load">جارٍ تحميل الشجرة…</div>

<div class="top-ui">
  <a class="brand" href="index.html" title="الصفحة الرئيسية"><span class="dot"></span><b>عشائر الحمودي</b></a>
  <div class="sbox">
    <input id="q" type="search" placeholder="ابحث عن اسم…" autocomplete="off">
    <div class="sug" id="sug"></div>
  </div>
  <div class="modes">
    <button id="mRel">صلة القرابة</button>
    <button id="mTour">عرض تلقائي</button>
    <button id="mFan">المروحة</button>
    <button id="mBub">الفقاعات</button>
  </div>
</div>
<div class="cap" id="cap"><b id="capN"></b><span id="capS"></span></div>
<button class="stopbtn" id="stop">إيقاف العرض</button>
<div class="sheet" id="rel">
  <button class="x" id="rx" title="إغلاق">×</button>
  <h2>صلة القرابة</h2>
  <div class="chain">اضغط على اسم في الخريطة أو ابحث عنه.</div>
  <div class="slots">
    <button class="slot act" id="slA"><small>الشخص الأول</small><span>—</span></button>
    <button class="slot" id="slB"><small>الشخص الثاني</small><span>—</span></button>
  </div>
  <div class="relres" id="relRes"></div>
</div>

<div class="ctl">
  <button id="zIn" title="تكبير">+</button>
  <button id="zOut" title="تصغير">−</button>
  <button id="xAll" class="txt" title="فتح كل الفروع">فتح الكل</button>
  <button id="cAll" class="txt" title="إغلاق الفروع">إغلاق الكل</button>
  <button id="zFit" title="عرض الشجرة كاملة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
</div>

<div class="sheet" id="sheet">
  <button class="x" id="sx" title="إغلاق">×</button>
  <h2 id="sN"></h2>
  <div class="chain" id="sC"></div>
  <div class="meta" id="sM"></div>
  <div class="acts">
    <a class="pri" id="sCard" href="#">البطاقة والملاحظات</a>
    <button id="sKids">أظهر الأبناء</button>
    <button id="sUp">الأب</button>
    <button id="sJour">رحلة النسب</button>
  </div>
</div>
<div id="circ"><div class="crumbs" id="cCrumbs"></div><div class="info" id="cInfo"></div><div class="board" id="cBoard"></div><div class="tip" id="cTip"></div></div>
<div class="hint" id="hint">اضغط الدائرة تحت الاسم لفتح أبنائه أو إغلاقهم • اسحب للتنقّل</div>

<script>
var TREE_URL='https://raw.githubusercontent.com/alhamoudi-family/alhamoudi-family.github.io/main/tree.json';
var $=function(i){return document.getElementById(i)};
var NS='http://www.w3.org/2000/svg';
var svg=$('svg'),world=$('world'),stage=$('stage');
var nodes=[],byPath={},ROOT=null,sel=null;
var T={x:0,y:0,k:1},ROWV=96,H=34,SGAP=14,MINK=.03,MAXK=3;

function build(tree){
  var cv=document.createElement('canvas').getContext('2d');
  (function walk(n,parent,depth){
    var path=parent?parent.path+' / '+n.name:n.name;
    var r={name:n.name,path:path,parent:parent,depth:depth,kids:[],desc:0};
    cv.font=(depth<4?'800 17px':'700 15px')+' Almarai';
    r.w=Math.ceil(cv.measureText(n.name).width)+(depth<4?40:32);
    nodes.push(r);byPath[path]=r;if(parent)parent.kids.push(r);
    (n.kids||[]).forEach(function(k){walk(k,r,depth+1)});
  })(tree,null,0);
  ROOT=nodes[0];
  for(var i=nodes.length-1;i>=0;i--){var r=nodes[i];r.kids.forEach(function(k){r.desc+=1+k.desc})}
  nodes.forEach(function(r){r.open=r.depth<3});
}
function vk(r){return r.open?r.kids:[]}
function visible(){var out=[];(function w(r){out.push(r);vk(r).forEach(w)})(ROOT);return out}
function layout(){
  (function sw(r){var ks=vk(r);ks.forEach(sw);var span=ks.reduce(function(t,k,i){return t+k.sw+(i?SGAP:0)},0);r.span=span;r.sw=Math.max(r.w,span)})(ROOT);
  (function place(r,start){
    r.y=r.depth*ROWV;
    var ks=vk(r);
    if(!ks.length){r.x=start-r.sw/2;return}
    var c=start-(r.sw-r.span)/2;
    ks.forEach(function(k){place(k,c);c-=k.sw+SGAP});
    var m=(ks[0].x+ks[ks.length-1].x)/2;
    r.x=Math.max(start-r.sw+r.w/2,Math.min(start-r.w/2,m));
  })(ROOT,0);
  if(!ROOT.open)return;
  var main=ROOT.kids.slice().sort(function(a,b){return b.desc-a.desc})[0];
  if(main){ROOT.x=main.x;var lx=main.x-main.w/2-SGAP*3,rx=main.x+main.w/2+SGAP*3,side=0;
    ROOT.kids.forEach(function(k){if(k===main||(k.open&&k.kids.length))return;
      if(side++%2===0){k.x=lx-k.w/2;lx-=k.w+SGAP*3}else{k.x=rx+k.w/2;rx+=k.w+SGAP*3}});}
}

function draw(){
  var L=$('links'),N=$('nodes');L.innerHTML='';N.innerHTML='';
  var onPath={},ends={};
  if(REL.on&&REL.a&&REL.b){var L2=lca(REL.a,REL.b);[REL.a,REL.b].forEach(function(x){ends[x.path]=1;for(var a=x;a&&a!==L2.parent;a=a.parent)onPath[a.path]=1})}
  else if(REL.on){[REL.a,REL.b].forEach(function(x){if(x){ends[x.path]=1;onPath[x.path]=1}})}
  else for(var a=sel;a;a=a.parent)onPath[a.path]=1;
  var vis=visible(),selEl=null;
  nodes.forEach(function(r){r.el=null;r.link=null});
  vis.forEach(function(r){
    if(r.parent){
      var p=r.parent,y1=p.y+H/2,y2=r.y-H/2,my=(y1+y2)/2;
      var e=document.createElementNS(NS,'path');
      e.setAttribute('class','lk'+(onPath[r.path]&&(!REL.on||onPath[r.parent.path])?' on':''));
      e.setAttribute('d','M'+p.x+','+y1+' C'+p.x+','+my+' '+r.x+','+my+' '+r.x+','+y2);
      L.appendChild(e);r.link=e;
    }
    var g=document.createElementNS(NS,'g');
    g.setAttribute('class','nd'+(r.depth<4?' top':' deep')+(r.hit?' hit':'')+((REL.on?ends[r.path]:sel===r)?' sel':(onPath[r.path]?' path':'')));
    g.setAttribute('transform','translate('+(r.x-r.w/2)+','+(r.y-H/2)+')');
    g.dataset.p=r.path;
    var rc=document.createElementNS(NS,'rect');
    rc.setAttribute('width',r.w);rc.setAttribute('height',H);rc.setAttribute('rx',H/2);
    var t=document.createElementNS(NS,'text');
    t.setAttribute('x',r.w/2);t.setAttribute('y',H/2+1);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
    t.textContent=r.name;
    g.appendChild(rc);g.appendChild(t);N.appendChild(g);r.el=g;if(sel===r)selEl=g;
    if(r.kids.length){
      var tg=document.createElementNS(NS,'g');tg.setAttribute('class','tg'+(r.open?' open':''));
      tg.setAttribute('transform','translate('+r.x+','+(r.y+H/2+13)+')');tg.dataset.t=r.path;
      var c=document.createElementNS(NS,'circle');c.setAttribute('r',13);
      var tt=document.createElementNS(NS,'text');tt.setAttribute('text-anchor','middle');tt.setAttribute('dominant-baseline','central');
      tt.textContent=r.open?'−':('+'+r.kids.length);
      tg.appendChild(c);tg.appendChild(tt);N.appendChild(tg);
    }
  });
  if(selEl)N.appendChild(selEl);
}
function relayout(anchor){
  var ox=anchor?anchor.x:0,oy=anchor?anchor.y:0;
  layout();draw();
  if(anchor){T.x+=(ox-anchor.x)*T.k;T.y+=(oy-anchor.y)*T.k;apply()}
}
function toggle(r){r.open=!r.open;relayout(r)}
function reveal(r){var ch=false;for(var a=r.parent;a;a=a.parent)if(!a.open){a.open=true;ch=true}if(ch)relayout()}

function apply(){
  world.setAttribute('transform','translate('+T.x+','+T.y+') scale('+T.k+')');
  svg.classList.toggle('far',T.k<.5);
}
function bounds(){var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;visible().forEach(function(r){x0=Math.min(x0,r.x-r.w/2);x1=Math.max(x1,r.x+r.w/2);y0=Math.min(y0,r.y);y1=Math.max(y1,r.y)});return{x0:x0,x1:x1,y0:y0-H,y1:y1+H}}
function fitT(){
  var b=bounds(),W=innerWidth,Hh=innerHeight,pad=70;
  var k=Math.min((W-pad*2)/(b.x1-b.x0),(Hh-pad*2-60)/(b.y1-b.y0));k=Math.max(MINK,Math.min(1,k));
  return{k:k,x:W/2-(b.x0+b.x1)/2*k,y:(Hh+60)/2-(b.y0+b.y1)/2*k};
}
var anim=null;
function fly(to,ms){
  cancelAnimationFrame(anim);var from={x:T.x,y:T.y,k:T.k},t0=performance.now();ms=ms||650;
  (function step(now){
    var p=Math.min(1,(now-t0)/ms),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    var k=Math.exp(Math.log(from.k)+(Math.log(to.k)-Math.log(from.k))*e);
    T.k=k;T.x=from.x+(to.x-from.x)*e;T.y=from.y+(to.y-from.y)*e;apply();
    if(p<1)anim=requestAnimationFrame(step);
  })(t0);
}
function centerOn(r,k){
  k=k||Math.max(T.k,1.1);
  var sheetH=$('sheet').style.display==='flex'?$('sheet').offsetHeight:0;
  var cx=r.x;
  fly({k:k,x:innerWidth/2-cx*k,y:(innerHeight-sheetH+60)/2-r.y*k});
}
function zoomAt(f,cx,cy){
  var k=Math.max(MINK,Math.min(MAXK,T.k*f));f=k/T.k;
  T.x=cx-(cx-T.x)*f;T.y=cy-(cy-T.y)*f;T.k=k;apply();
}

function select(r,move){
  if(view&&r){focusPath=(r.kids.length?r:(r.parent||r)).path;cdraw();return}
  if(REL.on&&r){relPick(r);return}
  sel=r;if(r)reveal(r);draw();
  if(!r){$('sheet').style.display='none';history.replaceState(null,'',location.pathname);return}
  var chain=[],a=r.parent;while(a&&a.depth>0){chain.push(a.name);a=a.parent}
  $('sN').textContent=r.name;
  $('sC').textContent=chain.length?'بن '+chain.join(' بن '):'';
  var m=$('sM');m.innerHTML='';
  function tag(t){var s=document.createElement('span');s.textContent=t;m.appendChild(s)}
  tag('الجيل '+(r.depth+1));
  if(r.kids.length)tag(r.kids.length+(r.kids.length>2&&r.kids.length<11?' أبناء':' ابن'));
  if(r.desc>r.kids.length)tag(r.desc+' من الذرية');
  $('sCard').href='full.html#'+encodeURIComponent(r.path);
  $('sKids').style.display=r.kids.length?'':'none';
  $('sUp').style.display=r.parent?'':'none';
  $('sheet').style.display='flex';
